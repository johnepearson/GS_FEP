[pytest]
# Run from the project root (the folder that holds the Makefile).  "pythonpath" does what
# "export PYTHONPATH=src:." does for the Makefile, so the tests can import the project's modules.
pythonpath = . src src/simulation src/analysis src/tools src/plotscripts
testpaths = tests
addopts = -q -p no:cacheprovider
